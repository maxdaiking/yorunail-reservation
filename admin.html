<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>予約管理</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f5f5f7;color:#1d1d1f;line-height:1.6;min-height:100vh;padding-bottom:80px}

.auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:linear-gradient(135deg,#06C755 0%,#04a847 100%)}
.auth-screen h1{color:#fff;font-size:1.5rem;margin-bottom:1.5rem}
.auth-screen p{color:rgba(255,255,255,.8);font-size:.9rem;text-align:center}
.auth-error{color:#ffe0e0;font-weight:600;margin-top:1rem;display:none}

.header{background:#fff;border-bottom:1px solid #e5e5ea;padding:.8rem 1rem;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1.1rem;font-weight:700}
.salon-name{font-size:.75rem;color:#86868b}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5ea;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:.6rem 0 .4rem;border:none;background:none;color:#86868b;font-size:.65rem;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .2s;min-height:56px}
.nav-item.active{color:#06C755}
.nav-item svg{width:26px;height:26px;margin-bottom:2px}

.page{display:none;padding:1rem}.page.active{display:block}
.section-title{font-size:.8rem;font-weight:700;color:#86868b;letter-spacing:.5px;margin:1.2rem 0 .6rem}

.today-card{background:linear-gradient(135deg,#06C755 0%,#04a847 100%);color:#fff;border-radius:16px;padding:1.2rem;margin-bottom:1rem}
.today-card .date{font-size:.85rem;opacity:.9}
.today-card .count{font-size:2.5rem;font-weight:800;line-height:1.2}
.today-card .label{font-size:.85rem;opacity:.9}
.today-stats{display:flex;gap:.6rem;margin-top:.8rem}
.today-stat{flex:1;background:rgba(255,255,255,.2);border-radius:10px;padding:.5rem;text-align:center}
.today-stat .num{font-size:1.3rem;font-weight:700}
.today-stat .lbl{font-size:.7rem;opacity:.85}

.res-card{background:#fff;border-radius:14px;padding:1rem 1.1rem;margin-bottom:.6rem;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;gap:.8rem;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s}
.res-card:active{transform:scale(.98)}
.res-time{min-width:52px;text-align:center}
.res-time .time{font-size:1rem;font-weight:700;color:#06C755}
.res-time .dur{font-size:.65rem;color:#86868b}
.res-info{flex:1;min-width:0}
.res-name{font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-menu{font-size:.8rem;color:#86868b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-status{padding:.25rem .6rem;border-radius:20px;font-size:.7rem;font-weight:600;white-space:nowrap}
.status-confirmed{background:#e8f5e9;color:#2e7d32}
.status-visited{background:#e3f2fd;color:#1565c0}
.status-cancelled{background:#fce4ec;color:#c62828}
.status-manual{background:#fff3e0;color:#e65100}

/* ===== SCHEDULE ===== */
.schedule-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.schedule-date{font-size:1.1rem;font-weight:700}
.date-nav-btn{width:48px;height:48px;border-radius:50%;border:1px solid #e5e5ea;background:#fff;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.date-nav-btn:active{background:#f0f0f0}
.today-btn{background:#06C755;color:#fff;border:none;border-radius:8px;padding:.4rem .8rem;font-size:.8rem;font-weight:600;cursor:pointer}
.holiday-banner{background:#fce4ec;border-radius:10px;padding:.8rem 1rem;margin-bottom:.8rem;font-size:.9rem;color:#c62828;font-weight:600;text-align:center}

.time-grid{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative}
.time-row{display:flex;height:48px;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
.time-row:active .time-area{background:#f0faf3}
.time-label{width:50px;flex-shrink:0;font-size:.7rem;font-weight:500;color:#86868b;text-align:right;padding-right:8px;line-height:1;align-self:flex-start;transform:translateY(-50%)}
.time-label.sub{color:transparent}
.time-area{flex:1;position:relative;min-height:48px;border-top:1px solid #e8e8ed;margin-left:-6px;padding-left:6px}
.time-row.half .time-area{border-top:1px dashed #f0f0f2}
.time-row.now{background:#fffde7}
.cal-event{position:absolute;left:4px;right:4px;border-radius:6px;padding:.3rem .5rem;font-size:.8rem;cursor:pointer;z-index:2;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.cal-event:active{opacity:.7}
.cal-event .ev-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-event .ev-menu{font-size:.7rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-event.ev-line{background:#06C755;color:#fff;border-left:none}
.cal-event.ev-manual{background:#ff9800;color:#fff}
.cal-event.ev-block{background:#e0e0e0;color:#999}

/* ===== MODAL ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:1.2rem;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:#d1d1d6;border-radius:2px;margin:0 auto 1rem}
.modal h2{font-size:1.2rem;margin-bottom:.8rem}
.detail-row{display:flex;padding:.7rem 0;border-bottom:1px solid #f0f0f2}
.detail-label{width:90px;flex-shrink:0;font-size:.85rem;color:#86868b;font-weight:600}
.detail-value{font-size:.95rem;flex:1}

/* ===== HISTORY ===== */
.history-item{display:flex;align-items:center;padding:.6rem 0;border-bottom:1px solid #f0f0f2;font-size:.85rem}
.history-date{width:80px;flex-shrink:0;color:#86868b;font-weight:600}
.history-detail{flex:1}
.history-menu{font-weight:600}
.history-sub{font-size:.75rem;color:#86868b}
.history-price{font-weight:700;color:#06C755;white-space:nowrap;margin-left:.5rem}
.visit-count-badge{display:inline-block;background:#06C755;color:#fff;font-size:.7rem;font-weight:700;padding:.15rem .5rem;border-radius:10px;margin-left:.4rem;vertical-align:middle}

/* ===== FORM ===== */
.form-group{margin-bottom:.8rem}
.form-label{display:block;font-size:.8rem;font-weight:600;color:#86868b;margin-bottom:.3rem}
.form-input{width:100%;padding:.7rem .8rem;border:1px solid #d1d1d6;border-radius:10px;font-size:.95rem;font-family:inherit;background:#fff;-webkit-appearance:none;appearance:none}
.form-input:focus{outline:none;border-color:#06C755;box-shadow:0 0 0 3px rgba(6,199,85,.15)}
.form-textarea{min-height:70px;resize:vertical}
.form-row{display:flex;gap:.5rem}
.form-row .form-group{flex:1}
.dur-btn{padding:.5rem .9rem;border:1px solid #d1d1d6;border-radius:10px;background:#fff;font-size:.9rem;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dur-btn.active{background:#ff9800;color:#fff;border-color:#ff9800}
.dur-btn:active{opacity:.7}

/* ===== BUTTONS ===== */
.btn{display:block;width:100%;padding:1rem;border:none;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:center;transition:opacity .2s;margin-top:.6rem}
.btn:active{opacity:.7}
.btn-primary{background:#06C755;color:#fff}
.btn-danger{background:#ff3b30;color:#fff}
.btn-outline{background:#fff;color:#1d1d1f;border:1px solid #d1d1d6}
.btn-warning{background:#ff9800;color:#fff}

/* ===== SETTINGS ===== */
.setting-group{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.setting-item{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.1rem;border-bottom:1px solid #f0f0f2;min-height:56px}
.setting-item:last-child{border-bottom:none}
.setting-label{font-size:.95rem}
.setting-value{font-size:.95rem;color:#86868b;text-align:right;max-width:55%}

.holiday-item{background:#fff;border-radius:14px;padding:.8rem 1rem;margin-bottom:.5rem;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between}
.holiday-info{flex:1}
.holiday-date{font-weight:600;font-size:.9rem}
.holiday-reason{font-size:.8rem;color:#86868b}
.delete-btn{width:40px;height:40px;border-radius:50%;border:none;background:#fce4ec;color:#c62828;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}

.empty-state{text-align:center;padding:3rem 1rem;color:#86868b}
.empty-state svg{width:64px;height:64px;opacity:.3;margin-bottom:1rem}
.empty-state p{font-size:1rem}
.tab-switch{display:flex;background:#e5e5ea;border-radius:10px;padding:3px;margin-bottom:1rem}
.tab-btn{flex:1;padding:.55rem;border:none;border-radius:8px;background:transparent;font-size:.8rem;font-weight:600;cursor:pointer;color:#86868b;-webkit-tap-highlight-color:transparent;transition:all .2s}
.tab-btn.active{background:#fff;color:#1d1d1f;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:.7rem 1.2rem;border-radius:10px;font-size:.85rem;font-weight:600;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

@media(min-width:768px){body{max-width:500px;margin:0 auto;box-shadow:0 0 30px rgba(0,0,0,.1)}.bottom-nav{max-width:500px;left:50%;transform:translateX(-50%)}}
</style>
</head>
<body>

<div id="authScreen" class="auth-screen">
  <h1>LINE予約システム</h1>
  <p>管理画面にアクセスしています...</p>
  <p class="auth-error" id="authError">アクセス権限がありません。<br>正しいURLでアクセスしてください。</p>
</div>

<div id="app" style="display:none;">
  <div class="header">
    <div><h1>予約管理</h1><div class="salon-name" id="salonName">サロン名</div></div>
    <div style="font-size:.75rem;color:#86868b;" id="headerDate"></div>
  </div>

  <!-- ホーム -->
  <div class="page active" id="pageHome">
    <div class="today-card">
      <div class="date" id="todayDate"></div>
      <div class="count" id="todayCount">0</div>
      <div class="label">件の予約</div>
      <div class="today-stats">
        <div class="today-stat"><div class="num" id="todayConfirmed">0</div><div class="lbl">確定</div></div>
        <div class="today-stat"><div class="num" id="todayCancelled">0</div><div class="lbl">キャンセル</div></div>
      </div>
    </div>
    <div class="section-title">次の予約</div>
    <div id="nextRes"></div>
    <div class="section-title">本日の予約</div>
    <div id="todayList"></div>
  </div>

  <!-- スケジュール -->
  <div class="page" id="pageSchedule">
    <div class="schedule-header">
      <button class="date-nav-btn" onclick="changeDate(-1)">◀</button>
      <div style="text-align:center;">
        <div class="schedule-date" id="scheduleDate"></div>
        <button class="today-btn" onclick="goToday()">今日</button>
      </div>
      <button class="date-nav-btn" onclick="changeDate(1)">▶</button>
    </div>
    <div id="holidayBanner"></div>
    <div class="time-grid" id="timeGrid"></div>
    <button class="btn btn-outline" style="margin-top:.8rem;" onclick="openHolidayModal()">この日を休業日にする</button>
  </div>

  <!-- 予約一覧 -->
  <div class="page" id="pageList">
    <div class="tab-switch">
      <button class="tab-btn active" onclick="filterList('all',this)">すべて</button>
      <button class="tab-btn" onclick="filterList('confirmed',this)">確定</button>
      <button class="tab-btn" onclick="filterList('cancelled',this)">キャンセル</button>
    </div>
    <div id="resList"></div>
  </div>

  <!-- 設定 -->
  <div class="page" id="pageSettings">
    <div class="section-title">サロン情報</div>
    <div class="setting-group">
      <div class="setting-item"><span class="setting-label">サロン名</span><span class="setting-value" id="setSalon">-</span></div>
      <div class="setting-item"><span class="setting-label">営業時間</span><span class="setting-value" id="setHours">-</span></div>
      <div class="setting-item"><span class="setting-label">定休日</span><span class="setting-value" id="setClosed">-</span></div>
      <div class="setting-item"><span class="setting-label">同時受付数</span><span class="setting-value" id="setCap">-</span></div>
      <div class="setting-item"><span class="setting-label">施術間インターバル</span><span class="setting-value" id="setInterval">-</span></div>
    </div>
    <div class="section-title">休業日</div>
    <div id="holidayList"></div>
    <button class="btn btn-outline" style="margin-top:.3rem;" onclick="openHolidayModal()">＋ 休業日を追加</button>
    <div class="section-title">連携</div>
    <div class="setting-group">
      <div class="setting-item"><span class="setting-label">Googleカレンダー</span><span class="setting-value" id="setCal">-</span></div>
      <div class="setting-item"><span class="setting-label">予約データ件数</span><span class="setting-value" id="setCount">-</span></div>
    </div>
    <div class="section-title">データ管理</div>
    <div class="setting-group">
      <div class="setting-item" style="cursor:pointer;" onclick="exportCSV()">
        <span class="setting-label">予約データをダウンロード</span><span class="setting-value" style="color:#06C755;font-weight:600;">CSV ↓</span>
      </div>
    </div>
    <p style="text-align:center;color:#86868b;font-size:.7rem;margin-top:2rem;">LINE予約システム v2.0<br>合同会社SuzuLabo</p>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="showPage('Home',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>ホーム</button>
    <button class="nav-item" onclick="showPage('Schedule',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>スケジュール</button>
    <button class="nav-item" onclick="showPage('List',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>予約一覧</button>
    <button class="nav-item" onclick="showPage('Settings',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>設定</button>
  </nav>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div id="modalActions" style="margin-top:1rem;"></div>
  </div>
</div>

<!-- ACTION SHEET -->
<div id="actionSheet" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:210;align-items:flex-end;justify-content:center" onclick="closeAS(event)">
  <div style="background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:500px;padding:1.2rem;padding-bottom:calc(1.2rem + env(safe-area-inset-bottom,0));animation:slideUp .25s ease" onclick="event.stopPropagation()">
    <h3 id="asTitle" style="font-size:1rem;font-weight:700;margin-bottom:.2rem;"></h3>
    <p id="asSub" style="font-size:.8rem;color:#86868b;margin-bottom:1rem;"></p>
    <button onclick="asToReservation()" style="display:flex;align-items:center;gap:.8rem;width:100%;padding:1rem;border:none;border-radius:14px;background:#fff3e0;font-size:1rem;font-weight:600;cursor:pointer;margin-bottom:.5rem;-webkit-tap-highlight-color:transparent;text-align:left">
      <span style="width:44px;height:44px;border-radius:12px;background:#ff9800;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0">＋</span>
      <span><span style="display:block;color:#e65100">口頭予約を追加</span><span style="display:block;font-size:.75rem;font-weight:400;color:#86868b">電話・来店などLINE以外の予約</span></span>
    </button>
    <button onclick="asToBlock()" style="display:flex;align-items:center;gap:.8rem;width:100%;padding:1rem;border:none;border-radius:14px;background:#f5f5f5;font-size:1rem;font-weight:600;cursor:pointer;margin-bottom:.5rem;-webkit-tap-highlight-color:transparent;text-align:left">
      <span style="width:44px;height:44px;border-radius:12px;background:#bbb;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0">✕</span>
      <span><span style="display:block;color:#666">受付不可にする</span><span style="display:block;font-size:.75rem;font-weight:400;color:#86868b">休憩・私用などでこの時間を閉じる</span></span>
    </button>
    <button onclick="closeAS()" style="width:100%;padding:.8rem;border:1px solid #e5e5ea;border-radius:14px;background:#fff;font-size:.9rem;color:#86868b;cursor:pointer;margin-top:.3rem">キャンセル</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL='';
let AUTH_TOKEN='';
let viewDate=new Date();
let reservations=[];
let blocks=[];
let holidays=[];
let settings={};
let currentFilter='all';
let nextId=100;
let nextBlockId=100;

function init(){
  const p=new URLSearchParams(location.search);
  AUTH_TOKEN=p.get('token');
  if(!GAS_URL){loadDemo();return}
  if(!AUTH_TOKEN){document.getElementById('authError').style.display='block';return}
  fetchData();
}

function loadDemo(){
  const today=fmtDate(new Date());
  const tmr=fmtDate(new Date(Date.now()+864e5));
  const day3=fmtDate(new Date(Date.now()+864e5*3));
  const past1=fmtDate(new Date(Date.now()-864e5*7));
  const past2=fmtDate(new Date(Date.now()-864e5*21));
  const past3=fmtDate(new Date(Date.now()-864e5*45));
  settings={salonName:'デモサロン',openTime:'10:00',closeTime:'20:00',closedDays:'火,水',capacity:1,interval:0,calendarId:''};
  reservations=[
    {id:1,date:today,time:'10:00',endTime:'11:00',name:'田中 花子',menu:'ジェルネイル（ワンカラー）',duration:60,status:'confirmed',source:'line',phone:'090-1234-5678',lineUid:'U1234',note:'',customerMemo:'常連のお客様。ラメ系が好み。',price:6000},
    {id:2,date:today,time:'11:30',endTime:'13:00',name:'佐藤 美咲',menu:'ジェルネイル（アート）',duration:90,status:'confirmed',source:'line',phone:'080-2345-6789',lineUid:'U2345',note:'初めてのお客様',customerMemo:'',price:8500},

// ===== SCHEDULE (Googleカレンダー風) =====
const ROW_H=48; // 30分あたりのpx高さ
let selectedSlot={date:'',time:'',endTime:''};

function toMin(t){const[h,m]=t.split(':').map(Number);return h*60+m}
function minToStr(m){return (''+(m/60|0)).padStart(2,'0')+':'+(''+(m%60)).padStart(2,'0')}

function renderSchedule(){
  const d=viewDate,wd=['日','月','火','水','木','金','土'];
  document.getElementById('scheduleDate').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日（'+wd[d.getDay()]+'）';
  const ds=fmtDate(d);
  const hol=holidays.find(h=>h.date===ds);
  document.getElementById('holidayBanner').innerHTML=hol?'<div class="holiday-banner">休業日：'+(hol.reason||'')+'</div>':'';

  const dayRes=reservations.filter(r=>r.date===ds&&r.status!=='cancelled');
  const dayBlocks=blocks.filter(b=>b.date===ds);
  const openH=parseInt(settings.openTime)||10,closeH=parseInt(settings.closeTime)||20;
  const openMin=openH*60,closeMin=closeH*60;
  const nowM=new Date().getHours()*60+new Date().getMinutes();
  const isToday=ds===fmtDate(new Date());

  // 30分刻みの行を生成
  let html='';
  for(let m=openMin;m<closeMin;m+=30){
    const h=m/60|0,mm=m%60;
    const label=mm===0?(h+':00'):'';
    const isNow=isToday&&nowM>=m&&nowM<m+30;
    const timeStr=minToStr(m);
    html+='<div class="time-row'+(mm===30?' half':'')+(isNow?' now':'')+'" onclick="openAS(\''+ds+'\',\''+timeStr+'\')">'
      +'<div class="time-label'+(mm===30?' sub':'')+'">'+label+'</div>'
      +'<div class="time-area"></div></div>';
  }

  // イベント（予約）をabsolute配置
  let events='';
  dayRes.forEach(r=>{
    const top=((toMin(r.time)-openMin)/30)*ROW_H;
    const height=Math.max((r.duration/30)*ROW_H-4,24);
    const cls=r.source==='manual'?'ev-manual':'ev-line';
    events+='<div class="cal-event '+cls+'" style="top:'+top+'px;height:'+height+'px;" onclick="event.stopPropagation();showDetail('+r.id+')">'
      +'<div class="ev-name">'+r.time+' '+r.name+(r.source==='manual'?' (口頭)':'')+'</div>'
      +(height>30?'<div class="ev-menu">'+r.menu+'</div>':'')
      +'</div>';
  });
  dayBlocks.forEach(b=>{
    const top=((toMin(b.startTime)-openMin)/30)*ROW_H;
    const dur=toMin(b.endTime)-toMin(b.startTime);
    const height=Math.max((dur/30)*ROW_H-4,24);
    events+='<div class="cal-event ev-block" style="top:'+top+'px;height:'+height+'px;" onclick="event.stopPropagation();showBlockDetail('+b.id+')">'
      +'<div class="ev-name">受付不可</div>'
      +(height>30?'<div class="ev-menu">'+b.reason+'</div>':'')
      +'</div>';
  });

  // 現在時刻ライン
  if(isToday&&nowM>=openMin&&nowM<closeMin){
    const lineTop=((nowM-openMin)/30)*ROW_H;
    events+='<div style="position:absolute;top:'+lineTop+'px;left:46px;right:0;height:2px;background:#ff3b30;z-index:3;pointer-events:none"><div style="width:8px;height:8px;border-radius:50%;background:#ff3b30;position:absolute;left:-4px;top:-3px;"></div></div>';
  }

  document.getElementById('timeGrid').innerHTML='<div style="position:relative;">'+html+'<div style="position:absolute;top:0;left:50px;right:0;bottom:0;pointer-events:none;">'+events.replace(/pointer-events:none/g,'pointer-events:auto')+'</div></div>';
}

// ===== CARD =====
function isPast(r){return new Date(r.date+'T'+(r.endTime||r.time))<new Date()}
function resCard(r){
  let l,c;
  if(r.status==='cancelled'){l='キャンセル';c='status-cancelled'}
  else if(isPast(r)){l='来店済み';c='status-visited'}
  else if(r.source==='manual'){l='口頭予約';c='status-manual'}
  else{l='確定';c='status-confirmed'}
  return '<div class="res-card" onclick="showDetail('+r.id+')">'
    +'<div class="res-time"><div class="time">'+r.time+'</div><div class="dur">'+r.duration+'分</div></div>'
    +'<div class="res-info"><div class="res-name">'+r.name+'</div><div class="res-menu">'+r.menu+'</div></div>'
    +'<span class="res-status '+c+'">'+l+'</span></div>';
}

// ===== CUSTOMER HISTORY =====
function getCustomerHistory(phone,currentId){
  if(!phone) return [];
  return reservations.filter(r=>r.phone===phone&&r.id!==currentId&&r.status==='confirmed')
    .sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
}

function historyRow(h){
  const dd=new Date(h.date);
  return '<div class="history-item">'
    +'<div class="history-date">'+(dd.getMonth()+1)+'/'+dd.getDate()+'</div>'
    +'<div class="history-detail"><div class="history-menu">'+h.menu+'</div>'
    +(h.customerMemo?'<div class="history-sub">'+h.customerMemo+'</div>':'')
    +'</div>'
    +(h.price?'<div class="history-price">¥'+h.price.toLocaleString()+'</div>':'')
    +'</div>';
}
function renderHistory(hist){
  if(!hist.length) return '<div style="color:#86868b;font-size:.85rem;padding:.5rem 0;">履歴なし（初回来店）</div>';
  let html=historyRow(hist[0]);
  if(hist.length>1){
    html+='<div id="historyMore" style="display:none;">'+hist.slice(1).map(h=>historyRow(h)).join('')+'</div>'
      +'<button id="historyToggle" onclick="toggleHistory()" style="width:100%;padding:.6rem;border:1px solid #e5e5ea;border-radius:10px;background:#fff;color:#06C755;font-size:.85rem;font-weight:600;cursor:pointer;margin-top:.5rem;-webkit-tap-highlight-color:transparent;">過去の履歴をもっと見る（'+hist.slice(1).length+'件）</button>';
  }
  return html;
}
function toggleHistory(){
  const el=document.getElementById('historyMore'),btn=document.getElementById('historyToggle');
  if(el.style.display==='none'){el.style.display='block';btn.textContent='閉じる'}
  else{el.style.display='none';btn.textContent='過去の履歴をもっと見る'}
}

  else{stLabel='確定';stClass='status-confirmed'}

  const hist=getCustomerHistory(r.phone,r.id);
  const visitCount=hist.length+1;
  const totalSpent=hist.reduce((s,h)=>s+(h.price||0),0)+(r.price||0);

  document.getElementById('modalTitle').innerHTML=r.name
    +(visitCount>1?'<span class="visit-count-badge">来店'+visitCount+'回目</span>':'<span class="visit-count-badge" style="background:#ff9800;">初回</span>');

    +'<div class="detail-row"><div class="detail-label">電話番号</div><div class="detail-value">'+(r.phone?'<a href="tel:'+r.phone+'" style="color:#06C755;font-weight:600;font-size:1.05rem;">'+r.phone+'</a>':'未登録')+'</div></div>'
    +'<div class="detail-row"><div class="detail-label">予約経路</div><div class="detail-value">'+(r.source==='manual'?'口頭（電話・来店）':'LINE')+'</div></div>'
    +'<div class="detail-row"><div class="detail-label">ステータス</div><div class="detail-value"><span class="res-status '+stClass+'">'+stLabel+'</span></div></div>'
    +(r.note?'<div class="detail-row"><div class="detail-label">予約メモ</div><div class="detail-value">'+r.note+'</div></div>':'')

    +'<div class="section-title" style="margin-top:1.2rem;">来店履歴'+(totalSpent?' <span style="font-weight:400;font-size:.75rem;color:#06C755;">合計 ¥'+totalSpent.toLocaleString()+'</span>':'')+'</div>'

  }

function timeOptions(selected){
  const open=parseInt(settings.openTime)||10,close=parseInt(settings.closeTime)||20;
  let html='';
  for(let h=open;h<=close;h++){
    for(let m=0;m<60;m+=15){
      if(h===close&&m>0)break;
      const v=(''+ h).padStart(2,'0')+':'+(''+ m).padStart(2,'0');
      html+='<option value="'+v+'"'+(v===selected?' selected':'')+'>'+v+'</option>';
    }
  }
  return html;
}
function openBlockModal(date,time){
  const ds=date||fmtDate(viewDate);
  const startT=time||'12:00';
  const endT=minToStr(Math.min(toMin(startT)+120, toMin((settings.closeTime||20)+':00')));
  document.getElementById('modalTitle').textContent='受付不可を設定';
  document.getElementById('modalBody').innerHTML=
    '<div class="form-group"><label class="form-label">日付</label><input type="date" class="form-input" id="blockDate" value="'+ds+'"></div>'
    +'<div class="form-row">'
    +'<div class="form-group"><label class="form-label">開始</label><select class="form-input" id="blockStart">'+timeOptions(startT)+'</select></div>'
    +'<div class="form-group"><label class="form-label">終了</label><select class="form-input" id="blockEnd">'+timeOptions(endT)+'</select></div>'
    +'</div>'
    +'<div class="form-group"><label class="form-label">理由（任意）</label><input type="text" class="form-input" id="blockReason" placeholder="例：昼休憩、私用"></div>';
  document.getElementById('modalActions').innerHTML=
    '<button class="btn btn-primary" onclick="saveBlock()">設定する</button>'
    +'<button class="btn btn-outline" onclick="closeModal()">やめる</button>';
  document.getElementById('modalOverlay').classList.add('open');
}
async function saveBlock(){
  const date=document.getElementById('blockDate').value,start=document.getElementById('blockStart').value,end=document.getElementById('blockEnd').value,reason=document.getElementById('blockReason').value;
  if(!date||!start||!end){toast('日付と時間を入力してください');return}
  if(start>=end){toast('終了時間は開始時間より後にしてください');return}
  blocks.push({id:nextBlockId++,date,startTime:start,endTime:end,reason});
  if(GAS_URL){try{await fetch(GAS_URL+'?action=addBlock&token='+AUTH_TOKEN+'&date='+date+'&start='+start+'&end='+end+'&reason='+encodeURIComponent(reason))}catch(e){}}
  closeModal();toast('受付不可を設定しました');renderSchedule();
}
async function deleteBlock(id){
  blocks=blocks.filter(b=>b.id!==id);
  if(GAS_URL){try{await fetch(GAS_URL+'?action=deleteBlock&token='+AUTH_TOKEN+'&id='+id)}catch(e){}}
  closeModal();toast('受付不可を解除しました');renderSchedule();
}

async function saveHoliday(){
  const date=document.getElementById('holidayDate').value,reason=document.getElementById('holidayReason').value;
  if(!date){toast('日付を入力してください');return}
  if(holidays.find(h=>h.date===date)){toast('この日は既に休業日です');return}
  holidays.push({date,reason});
  if(GAS_URL){try{await fetch(GAS_URL+'?action=addHoliday&token='+AUTH_TOKEN+'&date='+date+'&reason='+encodeURIComponent(reason))}catch(e){}}
  closeModal();toast('休業日を設定しました');renderSchedule();renderHolidayList();
}
async function deleteHoliday(date){
  if(!confirm(date+' の休業日を解除しますか？'))return;
  holidays=holidays.filter(h=>h.date!==date);
  if(GAS_URL){try{await fetch(GAS_URL+'?action=deleteHoliday&token='+AUTH_TOKEN+'&date='+date)}catch(e){}}
  toast('休業日を解除しました');renderSchedule();renderHolidayList();
}
function renderHolidayList(){
  const el=document.getElementById('holidayList');
  const future=holidays.filter(h=>h.date>=fmtDate(new Date())).sort((a,b)=>a.date.localeCompare(b.date));
  if(!future.length){el.innerHTML='<div style="text-align:center;padding:1rem;color:#86868b;font-size:.85rem;">設定なし</div>';return}
  const wd=['日','月','火','水','木','金','土'];
  el.innerHTML=future.map(h=>{const dd=new Date(h.date);return '<div class="holiday-item"><div class="holiday-info"><div class="holiday-date">'+(dd.getMonth()+1)+'/'+dd.getDate()+'（'+wd[dd.getDay()]+'）</div><div class="holiday-reason">'+(h.reason||'-')+'</div></div><button class="delete-btn" onclick="deleteHoliday(\''+h.date+'\')">✕</button></div>'}).join('');
}

// ===== ADD RESERVATION =====
function openAddReservation(date,time){
  const ds=date||fmtDate(viewDate);
  const startT=time||(settings.openTime?((''+(settings.openTime)).padStart(2,'0')+':00'):'10:00');
  const dur=120;
  document.getElementById('modalTitle').textContent='口頭予約を追加';
  document.getElementById('modalBody').innerHTML=
    '<div class="form-row">'
    +'<div class="form-group"><label class="form-label">日付</label><input type="date" class="form-input" id="addDate" value="'+ds+'"></div>'
    +'<div class="form-group"><label class="form-label">開始時間</label><select class="form-input" id="addTime">'+timeOptions(startT)+'</select></div>'
    +'</div>'
    +'<div class="form-group"><label class="form-label">施術時間（分）</label>'
    +'<div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.4rem;">'
    +[30,60,90,120,150,180].map(function(v){return '<button type="button" class="dur-btn'+(v===dur?' active':'')+'" onclick="pickDur('+v+',this)">'+v+'</button>'}).join('')
    +'</div>'
    +'<input type="number" class="form-input" id="addDuration" value="'+dur+'" min="15" step="15" style="width:120px;" onchange="syncDurBtns(this.value)">'
    +'</div>'
    +'<div class="form-group"><label class="form-label">お客様名</label><input type="text" class="form-input" id="addName" placeholder="例：山田 太郎"></div>'
    +'<div class="form-group"><label class="form-label">メニュー</label><input type="text" class="form-input" id="addMenu" placeholder="例：ジェルネイル"></div>'
    +'<div class="form-row">'
    +'<div class="form-group"><label class="form-label">金額（税込）</label><input type="number" class="form-input" id="addPrice" placeholder="6000" min="0" step="100"></div>'
    +'<div class="form-group"><label class="form-label">電話番号</label><input type="tel" class="form-input" id="addPhone" placeholder="090-0000-0000" oninput="checkLineLink()"></div>'
    +'</div>'
    +'<div id="lineLinkInfo"></div>'
    +'<div class="form-group"><label class="form-label">メモ（任意）</label><textarea class="form-input form-textarea" id="addNote" placeholder="お客様情報など"></textarea></div>';
  document.getElementById('modalActions').innerHTML=
    '<button class="btn btn-warning" onclick="saveReservation()">口頭予約を追加</button>'
    +'<button class="btn btn-outline" onclick="closeModal()">やめる</button>';
  document.getElementById('modalOverlay').classList.add('open');
}
function pickDur(min,btn){
  document.getElementById('addDuration').value=min;
  document.querySelectorAll('.dur-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function syncDurBtns(val){
  const v=parseInt(val);
  document.querySelectorAll('.dur-btn').forEach(b=>{
    b.classList.toggle('active',parseInt(b.textContent)===v);
  });
}
function checkLineLink(){
  const phone=document.getElementById('addPhone').value.trim();
  const el=document.getElementById('lineLinkInfo');
  if(!phone||phone.length<10){el.innerHTML='';return}
  const past=reservations.find(r=>r.phone===phone&&r.lineUid);
  if(past){
    el.innerHTML='<div style="background:#e8f5e9;border-radius:10px;padding:.7rem;margin:.5rem 0;font-size:.85rem;">'
      +'<span style="color:#2e7d32;font-weight:600;">LINE連携済み：'+past.name+'</span><br>'
      +'<label style="display:flex;align-items:center;gap:.4rem;margin-top:.3rem;cursor:pointer;">'
      +'<input type="checkbox" id="sendLineNotify" checked style="width:18px;height:18px;accent-color:#06C755;">'
      +'<span style="font-size:.85rem;">LINEに予約確認を通知する</span></label></div>';
  }else{
    el.innerHTML='<div style="color:#86868b;font-size:.8rem;margin:.3rem 0;">この電話番号のLINE登録はありません</div>';
  }
}

async function saveReservation(){
  const date=document.getElementById('addDate').value,time=document.getElementById('addTime').value;
  const duration=parseInt(document.getElementById('addDuration').value)||60;
  const name=document.getElementById('addName').value.trim(),menu=document.getElementById('addMenu').value.trim();
  const phone=document.getElementById('addPhone').value.trim(),note=document.getElementById('addNote').value.trim();
  const price=parseInt(document.getElementById('addPrice').value)||0;
  if(!date||!time||!name||!menu){toast('日付・時間・名前・メニューは必須です');return}
  const [hh,mm]=time.split(':').map(Number);
  const endMin=hh*60+mm+duration;
  const endTime=(''+(endMin/60|0)).padStart(2,'0')+':'+(''+(endMin%60)).padStart(2,'0');
  // LINE紐付けチェック
  let lineUid='';
  let sendLine=false;
  const pastLine=phone?reservations.find(r=>r.phone===phone&&r.lineUid):null;
  if(pastLine){
    lineUid=pastLine.lineUid;
    const cb=document.getElementById('sendLineNotify');
    sendLine=cb&&cb.checked;
  }
  const r={id:nextId++,date,time,endTime,duration,name,menu,phone,status:'confirmed',source:'manual',lineUid,note,customerMemo:note,price};
  reservations.push(r);
  if(GAS_URL){try{const params=new URLSearchParams({action:'addReservation',token:AUTH_TOKEN,date,time,endTime,duration:String(duration),name,menu,phone,note,source:'manual',price:String(price),lineUid,sendLine:sendLine?'1':'0'});await fetch(GAS_URL+'?'+params.toString())}catch(e){}}
  closeModal();toast(name+'さんの予約を追加しました');renderHome();renderSchedule();renderList();
}

// ===== MODAL / NAV / TOAST / UTIL =====
function closeModal(e){if(e&&e.target!==document.getElementById('modalOverlay'))return;document.getElementById('modalOverlay').classList.remove('open')}
function showPage(n,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));document.getElementById('page'+n).classList.add('active');btn.classList.add('active');if(n==='Schedule'){viewDate=new Date();renderSchedule()}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000)}
function exportCSV(){
  const h=['日付','時間','終了','名前','メニュー','所要時間','金額','ステータス','予約経路','電話番号','メモ','顧客メモ'];
  const rows=reservations.map(r=>[r.date,r.time,r.endTime,r.name,r.menu,r.duration,r.price||'',r.status,r.source||'line',r.phone,r.note,r.customerMemo||'']);
  const csv='\uFEFF'+[h,...rows].map(r=>r.map(c=>'"'+c+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download='予約データ_'+fmtDate(new Date())+'.csv';a.click();toast('CSVをダウンロードしました');
}
function fmtDate(d){return d.getFullYear()+'-'+(''+(d.getMonth()+1)).padStart(2,'0')+'-'+(''+ d.getDate()).padStart(2,'0')}

init();
</script>
